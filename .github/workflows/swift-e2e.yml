# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift E2E Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  E2ETest:
    name: E2E Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
    steps:
    - uses: actions/checkout@v4
    - uses: swift-actions/setup-swift@v2
      with:
        swift-version: "5.10"

    - name: Get swift version
      run: swift --version

    - name: Install .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.x'

    - name: Build .NET server
      working-directory: ./Tests/IntegrationTestServer
      run: dotnet build -p:DefineConstants="USE_AZURE_SIGNALR"

    - name: Set connection string 
      working-directory: ./Tests/IntegrationTestServer
      run: dotnet user-secrets set Azure:SignalR:ConnectionString "${{ secrets.E2E_CONNECTION_STRING }}"
      continue-on-error: false

    - name: Start IntegrationTestServer
      working-directory: ./Tests/IntegrationTestServer
      run: dotnet run -p:DefineConstants="USE_AZURE_SIGNALR" &
      continue-on-error: false

    - name: Wait for server to start
      run: sleep 5
    
    - name: Run E2E tests
      env:
        SIGNALR_INTEGRATION_TEST_URL: http://localhost:8080/test
      run: swift test --filter SignalRClientIntegrationTests
